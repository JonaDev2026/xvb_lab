name: Sync Stable 4.4.4 assets

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout XVB Lab
        uses: actions/checkout@v4

      - name: Retrieve original Stable assets
        run: |
          git clone --depth 1 --branch v4.4.4 https://github.com/JonaDev2026/xvb.git /tmp/xvb-stable
          rm -rf icone fonts
          cp -a /tmp/xvb-stable/icone ./icone
          cp -a /tmp/xvb-stable/fonts ./fonts
          cp /tmp/xvb-stable/icon.png ./icon.png

      - name: Commit original assets
        run: |
          git add icone fonts icon.png
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync original Stable 4.4.4 visual assets"
          git push
