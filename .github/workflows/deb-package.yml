name: Build Debian package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to package"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          path: source

      - name: Validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          SOURCE_VERSION="$(sed -n 's/^VERSIONE = "\(.*\)"/\1/p' source/xvb.py | head -n 1)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          [[ "$VERSION" == "$SOURCE_VERSION" ]] || { echo "::error::Tag and source versions differ"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Debian package
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y dpkg-dev
          cd source
          sh crea_deb.sh "${{ steps.version.outputs.version }}"

      - name: Validate package
        run: |
          set -euo pipefail
          PACKAGE="source/xvb_${{ steps.version.outputs.version }}_all.deb"
          test -s "$PACKAGE"
          dpkg-deb --info "$PACKAGE"

      - name: Attach package to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "source/xvb_${{ steps.version.outputs.version }}_all.deb" --repo "$GITHUB_REPOSITORY" --clobber
